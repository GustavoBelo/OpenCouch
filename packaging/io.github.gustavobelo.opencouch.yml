app-id: io.github.gustavobelo.opencouch
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
command: opencouch

finish-args:
  - --share=ipc
  - --filesystem=xdg-config/open-couch-engine:create
  - --talk-name=org.kde.StatusNotifierWatcher
  - --talk-name=org.freedesktop.portal.Desktop
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri

modules:
  - name: opencouch
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
    post-install:
      - install -Dm0644 LICENSE -t $FLATPAK_DEST/share/licenses/io.github.gustavobelo.opencouch
    sources:
      - type: dir
        path: ../app
      - type: dir
        path: .
        dest: packaging
      - type: file
        path: ../LICENSE
