name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  engine:
    name: Build the engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check version vs tag
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          FILE_VERSION="$(sed -n 's/^VERSION=//p' app/version.txt)"
          if [[ -z "${VERSION}" || "${VERSION}" != "${FILE_VERSION}" ]]; then
            echo "::error::app/version.txt (${FILE_VERSION}) differs from tag ${TAG}." >&2
            exit 1
          fi
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

      - uses: actions/setup-go@v5
        with:
          go-version-file: engine/go.mod
          cache-dependency-path: engine/go.sum

      - name: Test
        working-directory: engine
        run: |
          go vet ./...
          go test ./...

      # CGO_ENABLED=0 is what makes the binary genuinely static. The engine's
      # only dependencies are pure Go, so there is nothing to lose by it -- and
      # a static binary is the whole distribution story for anyone who wants the
      # command line without Qt.
      - name: Build
        working-directory: engine
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p ../dist
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH="${arch}" go build -trimpath \
              -ldflags "-s -w -X main.version=${VERSION}" \
              -o "../dist/open-couch-engine-linux-${arch}" \
              ./cmd/open-couch-engine
          done
          file ../dist/open-couch-engine-linux-amd64 | grep -q 'statically linked'
          (cd ../dist && sha256sum open-couch-engine-linux-* > SHA256SUMS)
          ls -la ../dist

      # The one that runs here is the one that gets published, so it answers for
      # itself rather than being taken on trust.
      - name: Smoke test the built binary
        run: |
          chmod +x dist/open-couch-engine-linux-amd64
          test "$(dist/open-couch-engine-linux-amd64 version)" = "${{ steps.version.outputs.version }}"
          dist/open-couch-engine-linux-amd64 check
          dist/open-couch-engine-linux-amd64 outputs >/dev/null

      - uses: actions/upload-artifact@v4
        with:
          name: engine
          path: dist/
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          name: engine
          path: dist

      # Idempotent on purpose: a release created by hand with detailed notes
      # must survive the workflow running after it, so an existing one only gets
      # its assets refreshed.
      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          ASSETS=(dist/open-couch-engine-linux-amd64 dist/open-couch-engine-linux-arm64 dist/SHA256SUMS)
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists, uploading assets..."
            gh release upload "${TAG}" "${ASSETS[@]}" --clobber
          else
            gh release create "${TAG}" "${ASSETS[@]}" \
              --title "Open Couch ${TAG}" \
              --generate-notes
          fi
