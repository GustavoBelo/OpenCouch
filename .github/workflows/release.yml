name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  appimage:
    name: Build AppImage
    runs-on: ubuntu-latest
    container:
      image: fedora:latest
    steps:
      - uses: actions/checkout@v5

      - name: Check version vs tag
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          FILE_VERSION="$(sed -n 's/^VERSION=//p' app/version.txt)"
          if [[ -z "${VERSION}" || "${VERSION}" != "${FILE_VERSION}" ]]; then
            echo "::error::app/version.txt (${FILE_VERSION}) differs from tag ${TAG}." >&2
            exit 1
          fi
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

      # Shared with ci.yml so the release artifact and the PR artifact are
      # built by exactly the same steps.
      - uses: ./.github/actions/build-appimage
        with:
          version: ${{ steps.version.outputs.version }}

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: OpenCouch-x86_64.AppImage
          path: OpenCouch-x86_64.AppImage
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: appimage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          name: OpenCouch-x86_64.AppImage

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            echo "Release ${{ github.ref_name }} already exists, uploading artifact..."
            gh release upload "${{ github.ref_name }}" "OpenCouch-x86_64.AppImage" --clobber
          else
            gh release create "${{ github.ref_name }}" \
              "OpenCouch-x86_64.AppImage" \
              --title "Open Couch ${{ github.ref_name }}" \
              --generate-notes
          fi
