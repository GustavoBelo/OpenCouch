name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  flatpak:
    name: Build Flatpak
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-48
      options: --privileged
    steps:
      - uses: actions/checkout@v5

      - name: Check version vs tag
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          FILE_VERSION="$(sed -n 's/^VERSION=//p' app/version.txt)"
          if [[ -z "${VERSION}" || "${VERSION}" != "${FILE_VERSION}" ]]; then
            echo "::error::app/version.txt (${FILE_VERSION}) differs from tag ${TAG}. Create the release with ./packaging/release.sh ${VERSION}." >&2
            exit 1
          fi
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Build Flatpak bundle
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: OpenCouch.flatpak
          manifest-path: packaging/io.github.gustavobelo.opencouch.yml
          branch: main
          cache-key: flatpak-kde-6.11-${{ runner.arch }}
          upload-artifact: false

      - name: Upload Flatpak bundle
        uses: actions/upload-artifact@v4
        with:
          name: OpenCouch.flatpak
          path: OpenCouch.flatpak
          if-no-files-found: error

  appimage:
    name: Build AppImage
    runs-on: ubuntu-latest
    container:
      image: fedora:latest
    steps:
        - uses: actions/checkout@v5

        - name: Check version vs tag
          id: version
          env:
            TAG: ${{ github.ref_name }}
          run: |
            VERSION="${TAG#v}"
            FILE_VERSION="$(sed -n 's/^VERSION=//p' app/version.txt)"
            if [[ -z "${VERSION}" || "${VERSION}" != "${FILE_VERSION}" ]]; then
              echo "::error::app/version.txt (${FILE_VERSION}) differs from tag ${TAG}." >&2
              exit 1
            fi
            echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

        - name: Install build dependencies
          run: |
            dnf update -y
            dnf install -y \
              gcc-c++ cmake ninja-build wget patchelf \
              qt6-qtbase-devel qt6-qtdeclarative-devel qt6-qttools-devel \
              qt6-qtwayland \
              kf6-kirigami-devel kf6-kcoreaddons-devel kf6-ki18n-devel \
              extra-cmake-modules \
              fuse file

        - name: Build app
          run: |
            cmake -S app -B app-build \
              -DCMAKE_BUILD_TYPE=Release \
              -DINSTALL_ENGINE_BUNDLE=ON \
              -DCMAKE_INSTALL_PREFIX=/usr
            cmake --build app-build --parallel $(nproc)
            DESTDIR="${GITHUB_WORKSPACE}/AppDir" cmake --install app-build

        - name: Download linuxdeploy
          run: |
            wget --no-verbose https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
            wget --no-verbose https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
            chmod +x linuxdeploy-x86_64.AppImage linuxdeploy-plugin-qt-x86_64.AppImage

            ./linuxdeploy-x86_64.AppImage --appimage-extract
            mv squashfs-root linuxdeploy-ext
            ./linuxdeploy-plugin-qt-x86_64.AppImage --appimage-extract
            mv squashfs-root qt-plugin-ext

            cp /usr/bin/patchelf linuxdeploy-ext/usr/bin/patchelf
            cp /usr/bin/patchelf qt-plugin-ext/usr/bin/patchelf

            ln -s $GITHUB_WORKSPACE/qt-plugin-ext/AppRun linuxdeploy-ext/usr/bin/linuxdeploy-plugin-qt

        - name: Build AppImage
          env:
            VERSION: ${{ steps.version.outputs.version }}
            QMAKE: qmake6
            QML_SOURCES_PATHS: ${{ github.workspace }}/app/qml
            EXTRA_QT_PLUGINS: wayland
            APPIMAGE_EXTRACT_AND_RUN: 1
            NO_STRIP: 1
          run: |
            mkdir -p AppDir/usr/plugins/platforms
            cp /usr/lib64/qt6/plugins/platforms/libqwayland*.so AppDir/usr/plugins/platforms/
            cp -r /usr/lib64/qt6/plugins/wayland-* AppDir/usr/plugins/

            ./linuxdeploy-ext/AppRun \
              --appdir AppDir \
              --plugin qt \
              --output appimage \
              --icon-file packaging/icons/io.github.gustavobelo.opencouch.svg \
              --desktop-file AppDir/usr/share/applications/io.github.gustavobelo.opencouch.desktop

            APPIMAGE_FILE=$(ls Open_Couch-*-x86_64.AppImage 2>/dev/null | head -1)
            if [[ -z "${APPIMAGE_FILE}" ]]; then
              echo "::error::No AppImage file found after build" >&2
              exit 1
            fi
            mv "${APPIMAGE_FILE}" OpenCouch-x86_64.AppImage

        - name: Upload AppImage
          uses: actions/upload-artifact@v4
          with:
            name: OpenCouch-x86_64.AppImage
            path: OpenCouch-x86_64.AppImage
            if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: [flatpak, appimage]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          name: OpenCouch.flatpak

      - uses: actions/download-artifact@v4
        with:
          name: OpenCouch-x86_64.AppImage

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            "OpenCouch.flatpak" \
            "OpenCouch-x86_64.AppImage" \
            --title "Open Couch ${{ github.ref_name }}" \
            --generate-notes
